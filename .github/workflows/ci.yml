name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reach
          POSTGRES_PASSWORD: reach_ci_only
          POSTGRES_DB: reach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://reach:reach_ci_only@localhost:5432/reach
      DATA_PROVIDER: mock
      LLM_PROVIDER: mock
      RUN_DB_TESTS: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
