services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: reach
      POSTGRES_PASSWORD: reach_local_only
      POSTGRES_DB: reach
    ports: ['127.0.0.1:5432:5432']
    volumes: [reach_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reach']
      interval: 2s
      retries: 20
volumes:
  reach_pg:
